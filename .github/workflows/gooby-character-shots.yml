name: Gooby character shots

# Debug simulator build that renders every Gooby pose, size, and the home forest.
# The app reads -GoobyCharacterShots in Debug builds
# (Gooby/Features/Character/GoobyCharacterShots.swift).
on:
  pull_request:
    paths:
      - 'Gooby/Features/Character/**'
      - 'Gooby/Features/Today/ForestScene.swift'
      - '.github/workflows/gooby-character-shots.yml'
  workflow_dispatch:

concurrency:
  group: gooby-character-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > devices.json
          PICK="$(python3 - <<'PY'
          import json
          runtimes = json.load(open("devices.json"))["devices"]
          phones = []
          for runtime in sorted(runtimes, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              phones += [d for d in runtimes[runtime] if d.get("isAvailable") and d["name"].startswith("iPhone")]
          for name in ["iPhone 16 Pro", "iPhone 17 Pro", "iPhone 15 Pro"]:
              match = [d for d in phones if d["name"] == name]
              if match:
                  print(match[0]["udid"] + " " + name)
                  break
          else:
              print(phones[0]["udid"] + " " + phones[0]["name"])
          PY
          )"
          UDID="${PICK%% *}"
          echo "Using simulator ${PICK#* } (${UDID})"
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"

      - name: Build Debug for the simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project Gooby.xcodeproj \
            -scheme Gooby \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ./simbuild \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Render character shots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          xcrun simctl install "${UDID}" simbuild/Build/Products/Debug-iphonesimulator/Gooby.app
          xcrun simctl status_bar "${UDID}" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl launch --terminate-running-process "${UDID}" app.mygooby.gooby -GoobyCharacterShots
          DATA="$(xcrun simctl get_app_container "${UDID}" app.mygooby.gooby data)"
          for _ in $(seq 1 90); do
            if [ -f "${DATA}/Documents/gooby-shots/done.txt" ]; then
              break
            fi
            sleep 2
          done
          mkdir -p shots
          sleep 2
          xcrun simctl io "${UDID}" screenshot shots/simulator-screen.png || true
          if [ ! -f "${DATA}/Documents/gooby-shots/done.txt" ]; then
            echo "Shots were not written."
            find "${DATA}" -name '*.txt' -o -name '*.png' | head -50 || true
            exit 1
          fi
          cp -R "${DATA}/Documents/gooby-shots/." shots/
          ls -la shots
          test -f shots/forest.png
          test -f shots/pose-idle-320.png

      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooby-character-shots
          path: shots
          if-no-files-found: warn
