name: Gooby screens

# Debug simulator build that opens each main screen and captures it with simctl.
# The app reads -GoobyScreenshot <screen> in Debug builds (Gooby/App/GoobyScreenshotMode.swift).
# Reference frames for comparison live on PR 34 (reference/finch-frames, 600×1304, about 390×847 pt).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gooby-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Pick a 390 pt wide iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > devices.json
          PICK="$(python3 - <<'PY'
          import json
          runtimes = json.load(open("devices.json"))["devices"]
          phones = []
          for runtime in sorted(runtimes, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              phones += [d for d in runtimes[runtime] if d.get("isAvailable") and d["name"].startswith("iPhone")]
          # 390x844 pt first, then the 393x852 pt phones.
          for name in ["iPhone 16e", "iPhone 14", "iPhone 13", "iPhone 12", "iPhone 15", "iPhone 16", "iPhone 17"]:
              match = [d for d in phones if d["name"] == name]
              if match:
                  print(match[0]["udid"] + " " + name)
                  break
          else:
              print(phones[0]["udid"] + " " + phones[0]["name"])
          PY
          )"
          UDID="${PICK%% *}"
          echo "Using simulator ${PICK#* } (${UDID})"
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"
          echo "name=${PICK#* }" >> "$GITHUB_OUTPUT"

      - name: Build Debug for the simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project Gooby.xcodeproj \
            -scheme Gooby \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ./simbuild \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture screens
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          DEVICE: ${{ steps.sim.outputs.name }}
        run: |
          set -euo pipefail
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          xcrun simctl install "${UDID}" simbuild/Build/Products/Debug-iphonesimulator/Gooby.app
          xcrun simctl status_bar "${UDID}" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          mkdir -p screens
          echo "${DEVICE}" > screens/device.txt
          for screen in home quests shop friends bag profile menu home-adventure; do
            xcrun simctl launch --terminate-running-process "${UDID}" app.mygooby.gooby -GoobyScreenshot "${screen}"
            sleep 9
            xcrun simctl io "${UDID}" screenshot "screens/${screen}.png"
            echo "captured ${screen}"
          done
          xcrun simctl terminate "${UDID}" app.mygooby.gooby || true
          ls -la screens
          for screen in home quests shop friends bag profile menu; do
            test -s "screens/${screen}.png"
          done

      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooby-screens
          path: screens
          if-no-files-found: warn
