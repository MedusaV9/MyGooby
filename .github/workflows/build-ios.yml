name: Build iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Gooby for generic iOS device
        run: |
          set -euo pipefail
          xcodebuild \
            -project Gooby.xcodeproj \
            -scheme Gooby \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="./build/Build/Products/Release-iphoneos/Gooby.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "Gooby.app was not produced for iphoneos."
            find ./build -name '*.app' -print || true
            exit 1
          fi
          case "${APP_PATH}" in
            *iphonesimulator*)
              echo "Refusing a simulator build."
              exit 1
              ;;
          esac
          if [ ! -f "${APP_PATH}/Gooby" ]; then
            echo "Gooby.app is missing its executable."
            exit 1
          fi
          if ! file "${APP_PATH}/Gooby" | grep -q 'arm64'; then
            echo "Executable is not an arm64 device binary."
            file "${APP_PATH}/Gooby"
            exit 1
          fi
          STAGE="$(mktemp -d)"
          mkdir -p "${STAGE}/Payload"
          cp -R "${APP_PATH}" "${STAGE}/Payload/Gooby.app"
          rm -f Gooby-unsigned.ipa
          ditto -c -k --keepParent "${STAGE}/Payload" "${RUNNER_TEMP}/payload.zip"
          # ditto --keepParent on the Payload directory stores Payload as the zip root.
          mv "${RUNNER_TEMP}/payload.zip" Gooby-unsigned.ipa
          unzip -t Gooby-unsigned.ipa
          unzip -l Gooby-unsigned.ipa
          unzip -l Gooby-unsigned.ipa | grep -q 'Payload/Gooby.app/Info.plist'
          unzip -l Gooby-unsigned.ipa | grep -q 'Payload/Gooby.app/Gooby'
          SIZE="$(stat -f%z Gooby-unsigned.ipa)"
          echo "IPA size ${SIZE} bytes"
          if [ "${SIZE}" -lt 80000 ]; then
            echo "IPA is too small to contain the real app."
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gooby-unsigned-ipa
          path: Gooby-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

  # Simulator screenshots for visual checks. Only on manual dispatch, never blocks the IPA job.
  # The app reads -GoobyShot <route> -GoobyLang <de|en> in Debug builds (Gooby/App/ShotMode.swift)
  # and then runs on an in-memory store with demo data.
  screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > devices.json
          PICK="$(python3 - <<'PY'
          import json
          runtimes = json.load(open("devices.json"))["devices"]
          phones = []
          for runtime in sorted(runtimes, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              phones += [d for d in runtimes[runtime] if d.get("isAvailable") and d["name"].startswith("iPhone")]
          for name in ["iPhone 16 Pro", "iPhone 17 Pro", "iPhone 15 Pro"]:
              match = [d for d in phones if d["name"] == name]
              if match:
                  print(match[0]["udid"] + " " + name)
                  break
          else:
              print(phones[0]["udid"] + " " + phones[0]["name"])
          PY
          )"
          UDID="${PICK%% *}"
          echo "Using simulator ${PICK#* } (${UDID})"
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"

      - name: Build Debug for the simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project Gooby.xcodeproj \
            -scheme Gooby \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ./simbuild \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          xcrun simctl install "${UDID}" simbuild/Build/Products/Debug-iphonesimulator/Gooby.app
          xcrun simctl status_bar "${UDID}" override --time "18:14" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          mkdir -p shots
          capture() {
            xcrun simctl launch --terminate-running-process "${UDID}" app.mygooby.gooby -GoobyShot "$2" -GoobyLang "$1" \
              || echo "launch failed for $1-$2"
            sleep 7
            xcrun simctl io "${UDID}" screenshot "shots/$1-$2.png" || echo "screenshot failed for $1-$2"
          }
          for route in home homeGoals quests shop friends bag pet petCollections micropedia menu settings onboarding; do
            capture en "${route}"
          done
          for route in home homeGoals menu settings pet; do
            capture de "${route}"
          done
          ls -l shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gooby-screenshots
          path: shots/
          if-no-files-found: warn
